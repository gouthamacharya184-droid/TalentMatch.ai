services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: talentmatch-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://talentmatch:talentmatch_secure_pass@db:5432/talentmatch_prod
      - SECRET_KEY=talentmatch-super-secret-production-key-2026-secure-32-chars
      - ENVIRONMENT=production
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      - LLM_ENABLED=true
      - LLM_MODEL=gemini-2.5-flash
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:8000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/storage/uploads
      - backups_data:/app/backups

  db:
    image: postgres:16-alpine
    container_name: talentmatch-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=talentmatch
      - POSTGRES_PASSWORD=talentmatch_secure_pass
      - POSTGRES_DB=talentmatch_prod
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentmatch -d talentmatch_prod"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  uploads_data:
  backups_data:
