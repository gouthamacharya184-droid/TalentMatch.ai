name: TalentMatch.ai CI/CD Pipeline

on:
  push:
    branches: [ main, audit/production-hardening ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Lint, Safety & Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio flake8 httpx

      - name: Run Backend Syntax & Flake8 Checks
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Execute Pytest Suite
        env:
          PYTHONPATH: .
          SECRET_KEY: test_secret_key_for_ci_pipeline_only_123456789
          ENVIRONMENT: test
        run: |
          pytest tests/ -v --maxfail=5

  frontend-test:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Type Checking & Build
        run: npm run build
