name: TalentMatch.ai CI/CD Pipeline

on:
  push:
    branches: [ main, cleanup/simple-structure ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx ruff bandit pip-audit

      - name: Security Scan (Bandit)
        run: |
          bandit -r backend/app -ll -q

      - name: Code Quality & Lint (Ruff)
        run: |
          ruff check backend/app

      - name: Execute Full Pytest Suite
        env:
          PYTHONPATH: backend:.
          SECRET_KEY: test_secret_key_for_ci_pipeline_only_123456789
          ENVIRONMENT: test
        run: |
          pytest -v

  frontend-test:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Oxlint Linter
        run: npm run lint

      - name: Run Type Checking & Build
        run: npm run build
